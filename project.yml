name: PhotoDeduper
options:
  bundleIdPrefix: com.photodeduper
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

targets:
  PhotoDeduper:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: PhotoDeduper
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
    settings:
      base:
        INFOPLIST_FILE: PhotoDeduper/Info.plist
        CODE_SIGN_ENTITLEMENTS: PhotoDeduper/PhotoDeduper.entitlements
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.photodeduper.app
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    frameworks:
      - framework: Photos.framework
        weak: false
      - framework: CoreImage.framework
        weak: false
      - framework: Security.framework
        weak: false

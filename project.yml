name: PhotoDeduper
options:
  bundleIdPrefix: com.photodeduper
  xcodeVersion: "15.0"
  createIntermediateGroups: true

schemes:
  PhotoDeduper:
    build:
      targets:
        PhotoDeduper: all
    run:
      config: Debug
      # NOTE: xcodegen has an off-by-one path bug for StoreKit config files.
      # After regenerating the xcodeproj, manually fix the xcscheme identifier:
      #   WRONG:   ../../PhotoDeduper/DeDuper.storekit
      #   CORRECT: ../../../PhotoDeduper/DeDuper.storekit   (3 levels up from xcschemes/)
      storeKitConfiguration: PhotoDeduper/DeDuper.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

targets:
  PhotoDeduper:
    type: application
    platforms: [macOS, iOS]
    supportedDestinations:
      - platform: macOS
        deploymentTarget: "14.0"
      - platform: iOS
        deploymentTarget: "17.0"
    sources:
      - path: PhotoDeduper
        excludes:
          - "**/*.plist"
          - "**/*.entitlements"
          - "**/CLAUDE.md"
          - "**/*.md"
          - "**/PrivacyInfo.xcprivacy"
          - "**/*.storekit"
    resources:
      - path: PhotoDeduper/PrivacyInfo.xcprivacy
    settings:
      base:
        INFOPLIST_FILE: PhotoDeduper/Info.plist
        SWIFT_VERSION: "5.9"
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "macosx iphoneos iphonesimulator"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.photodeduper.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 4WCQHY38RP
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: PhotoDeduper/PhotoDeduper.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]: PhotoDeduper/PhotoDeduper-iOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]: PhotoDeduper/PhotoDeduper-iOS.entitlements
        INFOPLIST_FILE[sdk=iphoneos*]: PhotoDeduper/Info-iOS.plist
        INFOPLIST_FILE[sdk=iphonesimulator*]: PhotoDeduper/Info-iOS.plist
    frameworks:
      - framework: Photos.framework
        weak: false
      - framework: CoreImage.framework
        weak: false
      - framework: Security.framework
        weak: false
      - framework: StoreKit.framework
        weak: false
